<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ことだま</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;700&family=Shippori+Mincho:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a12;
    --surface: #12121e;
    --border: rgba(255,255,255,0.08);
    --text: #e8e4f0;
    --muted: rgba(232,228,240,0.4);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* Stars background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 60%, rgba(255,255,255,0.15) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 70%, rgba(255,255,255,0.25) 0%, transparent 100%),
      radial-gradient(2px 2px at 35% 15%, rgba(255,255,255,0.15) 0%, transparent 100%),
      radial-gradient(1px 1px at 65% 45%, rgba(255,255,255,0.1) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 55%, rgba(255,255,255,0.2) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    padding: 40px 0 20px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  header h1 {
    font-family: 'Shippori Mincho', serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 700;
    letter-spacing: 0.3em;
    background: linear-gradient(135deg, #c8b8ff, #88d4ff, #ffd4a8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    margin-top: 8px;
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.15em;
  }

  /* Canvas */
  #canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* Main area */
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 600px;
    padding: 20px 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Effect display */
  #effect-display {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    position: relative;
    overflow: hidden;
  }

  #effect-display::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(200,184,255,0.03) 0%, transparent 70%);
    pointer-events: none;
  }

  #kotodama-word {
    font-family: 'Shippori Mincho', serif;
    font-size: clamp(2.5rem, 10vw, 5rem);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-align: center;
    transition: all 0.5s ease;
    line-height: 1.2;
  }

  #effect-desc {
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.05em;
    line-height: 1.8;
    max-width: 400px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #loading-indicator {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
  }

  .loading-dots {
    display: flex;
    gap: 6px;
  }

  .loading-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(200,184,255,0.6);
    animation: dotPulse 1.2s ease-in-out infinite;
  }

  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotPulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Placeholder */
  #placeholder {
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-align: center;
  }

  /* Input area */
  .input-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  #word-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 20px;
    color: var(--text);
    font-family: 'Shippori Mincho', serif;
    font-size: 1.4rem;
    letter-spacing: 0.2em;
    outline: none;
    transition: border-color 0.3s;
  }

  #word-input:focus {
    border-color: rgba(200,184,255,0.4);
  }

  #word-input::placeholder {
    color: rgba(232,228,240,0.2);
    font-size: 1rem;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    letter-spacing: 0.1em;
  }

  #cast-btn {
    background: linear-gradient(135deg, rgba(200,184,255,0.15), rgba(136,212,255,0.15));
    border: 1px solid rgba(200,184,255,0.3);
    border-radius: 14px;
    padding: 14px 24px;
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.3s;
    white-space: nowrap;
  }

  #cast-btn:hover:not(:disabled) {
    background: linear-gradient(135deg, rgba(200,184,255,0.25), rgba(136,212,255,0.25));
    border-color: rgba(200,184,255,0.5);
    transform: translateY(-1px);
  }

  #cast-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* History */
  #history {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .history-tag {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.3s;
    color: var(--muted);
  }

  .history-tag:hover {
    border-color: rgba(200,184,255,0.3);
    color: var(--text);
  }

  /* Error */
  #error-msg {
    color: rgba(255,140,140,0.8);
    font-size: 0.8rem;
    text-align: center;
    letter-spacing: 0.05em;
    display: none;
  }

  footer {
    position: relative;
    z-index: 1;
    padding: 20px;
    color: var(--muted);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-align: center;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<header>
  <h1>ことだま</h1>
  <p>あなたの言葉が、魔法になる</p>
</header>

<main>
  <div id="effect-display">
    <div id="placeholder">言葉を入れて、魔法を唱えよう</div>
    <div id="kotodama-word" style="display:none"></div>
    <div id="effect-desc" style="display:none"></div>
    <div id="loading-indicator">
      <div class="loading-dots">
        <span></span><span></span><span></span>
      </div>
      <span>言霊を読み解いています…</span>
    </div>
  </div>

  <div class="input-section">
    <div class="input-row">
      <input id="word-input" type="text" placeholder="ことばをいれてね" maxlength="10" />
      <button id="cast-btn">唱える</button>
    </div>
    <div id="error-msg"></div>
    <div id="history"></div>
  </div>
</main>

<footer>どんな言葉でも魔法になる</footer>

<script>
// ===== Canvas Particle System =====
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let animFrame;
let currentEffect = null;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ===== Helper draw functions =====
function drawStar(c, cx, cy, spikes, outerR, innerR) {
  let rot = (Math.PI / 2) * 3;
  const step = Math.PI / spikes;
  c.beginPath();
  c.moveTo(cx, cy - outerR);
  for (let i = 0; i < spikes; i++) {
    c.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
    rot += step;
    c.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
    rot += step;
  }
  c.lineTo(cx, cy - outerR);
  c.closePath();
}

function drawLightning(c, x1, y1, x2, y2, roughness, depth) {
  if (depth === 0) {
    c.moveTo(x1, y1);
    c.lineTo(x2, y2);
    return;
  }
  const mx = (x1 + x2) / 2 + (Math.random() - 0.5) * roughness;
  const my = (y1 + y2) / 2 + (Math.random() - 0.5) * roughness;
  drawLightning(c, x1, y1, mx, my, roughness / 2, depth - 1);
  drawLightning(c, mx, my, x2, y2, roughness / 2, depth - 1);
}

function drawRibbon(c, size, t) {
  c.beginPath();
  for (let i = 0; i <= 20; i++) {
    const a = (i / 20) * Math.PI * 2;
    const rx = Math.cos(a + t) * size;
    const ry = Math.sin(a * 2 + t) * size * 0.4;
    i === 0 ? c.moveTo(rx, ry) : c.lineTo(rx, ry);
  }
}

class Particle {
  constructor(effect) {
    this.reset(effect);
  }

  reset(effect) {
    const e = effect || currentEffect || defaultEffect();
    // Spawn across full screen
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;

    // Use origin if defined (for burst effects)
    if (e.originX !== undefined) this.x = e.originX + (Math.random() - 0.5) * canvas.width * 0.3;
    if (e.originY !== undefined) this.y = e.originY + (Math.random() - 0.5) * canvas.height * 0.3;

    const speed = e.speed * (0.4 + Math.random() * 1.2);
    const angle = e.directionAngle + (Math.random() - 0.5) * e.spread;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;

    this.life = 0;
    this.maxLife = e.lifetime * (0.6 + Math.random() * 0.8);
    this.size = e.size * (0.4 + Math.random() * 1.4);
    this.colors = e.colors;
    this.colorIndex = Math.floor(Math.random() * this.colors.length);
    this.shape = e.shape;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * e.rotationSpeed;
    this.gravity = e.gravity;
    this.wobble = e.wobble;
    this.wobbleSpeed = 0.03 + Math.random() * 0.08;
    this.wobbleAmp = 1 + Math.random() * 4;
    this.trail = e.trail;
    this.trailPoints = [];
    this.t = Math.random() * Math.PI * 2; // phase for animated shapes
    this.effect = e;

    // Lightning: pre-bake path
    if (this.shape === 'lightning') {
      this.lx2 = (Math.random() - 0.5) * this.size * 4;
      this.ly2 = (Math.random() - 0.5) * this.size * 4;
    }
    // Spiral
    if (this.shape === 'spiral') {
      this.spiralR = 0;
      this.spiralAngle = Math.random() * Math.PI * 2;
    }
  }

  update() {
    this.life++;
    this.t += 0.05;
    if (this.wobble) {
      this.vx += Math.sin(this.life * this.wobbleSpeed) * this.wobbleAmp * 0.08;
      this.vy += Math.cos(this.life * this.wobbleSpeed * 0.7) * this.wobbleAmp * 0.05;
    }
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.rotation += this.rotSpeed;

    if (this.shape === 'spiral') {
      this.spiralR += 0.3;
      this.spiralAngle += 0.15;
      this.x += Math.cos(this.spiralAngle) * 1.5;
      this.y += Math.sin(this.spiralAngle) * 1.5;
    }

    if (this.trail) {
      this.trailPoints.push({ x: this.x, y: this.y });
      if (this.trailPoints.length > 12) this.trailPoints.shift();
    }
  }

  draw() {
    const progress = this.life / this.maxLife;
    let alpha = progress < 0.15 ? progress / 0.15 : 1 - ((progress - 0.15) / 0.85);
    alpha = Math.max(0, Math.min(1, alpha));
    const size = this.size * (1 - progress * 0.2);

    ctx.save();

    if (this.trail && this.trailPoints.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trailPoints[0].x, this.trailPoints[0].y);
      for (let i = 1; i < this.trailPoints.length; i++) {
        ctx.lineTo(this.trailPoints[i].x, this.trailPoints[i].y);
      }
      const tc = this.colors[this.colorIndex];
      ctx.strokeStyle = tc.replace('rgb(', 'rgba(').replace(')', `,${alpha * 0.35})`);
      ctx.lineWidth = size * 0.4;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.globalAlpha = alpha;

    const color = this.colors[this.colorIndex];
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.shadowBlur = 20;
    ctx.shadowColor = color;

    const s = this.shape;

    if (s === 'circle') {
      ctx.beginPath();
      ctx.arc(0, 0, size, 0, Math.PI * 2);
      ctx.fill();

    } else if (s === 'ring') {
      ctx.beginPath();
      ctx.arc(0, 0, size, 0, Math.PI * 2);
      ctx.lineWidth = size * 0.3;
      ctx.stroke();

    } else if (s === 'star') {
      drawStar(ctx, 0, 0, 5, size, size * 0.4);
      ctx.fill();

    } else if (s === 'star6') {
      drawStar(ctx, 0, 0, 6, size, size * 0.5);
      ctx.fill();

    } else if (s === 'crystal') {
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.lineTo(size * 0.45, -size * 0.3);
      ctx.lineTo(size * 0.45, size * 0.3);
      ctx.lineTo(0, size);
      ctx.lineTo(-size * 0.45, size * 0.3);
      ctx.lineTo(-size * 0.45, -size * 0.3);
      ctx.closePath();
      ctx.fill();

    } else if (s === 'spark') {
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      for (let a = 0; a < 4; a++) {
        const ang = (a / 4) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(ang) * size, Math.sin(ang) * size);
        ctx.stroke();
      }

    } else if (s === 'burst') {
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      const rays = 8;
      for (let a = 0; a < rays; a++) {
        const ang = (a / rays) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang) * size * 0.3, Math.sin(ang) * size * 0.3);
        ctx.lineTo(Math.cos(ang) * size, Math.sin(ang) * size);
        ctx.stroke();
      }

    } else if (s === 'drop') {
      ctx.beginPath();
      ctx.arc(0, size * 0.2, size * 0.55, 0, Math.PI * 2);
      ctx.moveTo(-size * 0.25, size * 0.2);
      ctx.lineTo(0, -size);
      ctx.lineTo(size * 0.25, size * 0.2);
      ctx.fill();

    } else if (s === 'lightning') {
      ctx.beginPath();
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      drawLightning(ctx, 0, -size * 2, this.lx2, this.ly2, size * 1.5, 3);
      ctx.shadowBlur = 30;
      ctx.stroke();

    } else if (s === 'ribbon') {
      drawRibbon(ctx, size, this.t);
      ctx.lineWidth = 2;
      ctx.stroke();

    } else if (s === 'spiral') {
      ctx.beginPath();
      for (let i = 0; i < 30; i++) {
        const a = (i / 30) * Math.PI * 4;
        const r = (i / 30) * size;
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.lineWidth = 1.5;
      ctx.stroke();

    } else if (s === 'triangle') {
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.lineTo(size * 0.87, size * 0.5);
      ctx.lineTo(-size * 0.87, size * 0.5);
      ctx.closePath();
      ctx.fill();

    } else if (s === 'rune') {
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, -size); ctx.lineTo(0, size);
      ctx.moveTo(-size * 0.5, -size * 0.3); ctx.lineTo(size * 0.5, size * 0.3);
      ctx.moveTo(-size * 0.5, size * 0.3); ctx.lineTo(size * 0.5, -size * 0.3);
      ctx.stroke();

    } else if (s === 'square') {
      ctx.fillRect(-size * 0.6, -size * 0.6, size * 1.2, size * 1.2);

    } else if (s === 'cross') {
      ctx.lineWidth = size * 0.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-size, 0); ctx.lineTo(size, 0);
      ctx.moveTo(0, -size); ctx.lineTo(0, size);
      ctx.stroke();

    } else {
      ctx.beginPath();
      ctx.arc(0, 0, size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  isDead() {
    return this.life >= this.maxLife;
  }
}

function defaultEffect() {
  return {
    colors: ['rgb(200,184,255)', 'rgb(136,212,255)', 'rgb(255,220,180)'],
    shape: 'star',
    speed: 2.5,
    spread: Math.PI * 2,
    directionAngle: -Math.PI / 2,
    lifetime: 120,
    size: 6,
    gravity: -0.02,
    wobble: true,
    rotationSpeed: 0.08,
    trail: true,
    count: 120,
    stagger: 8,
    maxCount: 180,
    spawnRate: 0.5,
  };
}

function spawnBurst(effect) {
  currentEffect = effect;
  // Set spawn origin to screen center
  currentEffect.originX = canvas.width / 2;
  currentEffect.originY = canvas.height / 2;
  const count = effect.count || 80;
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      particles.push(new Particle(currentEffect));
    }, i * (effect.stagger || 5));
  }
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => {
    p.update();
    p.draw();
    return !p.isDead();
  });

  if (currentEffect && particles.length < (currentEffect.maxCount || 180)) {
    if (Math.random() < (currentEffect.spawnRate || 0.5)) {
      particles.push(new Particle(currentEffect));
    }
  }

  animFrame = requestAnimationFrame(animate);
}
animate();

// ===== AI Integration =====
async function fetchEffectFromAI(word) {
  const prompt = `あなたは「ことだま」という魔法エフェクトゲームのAIです。
ユーザーが入力した言葉を受け取り、その言葉の語感・音・意味・雰囲気からパーティクルエフェクトのパラメータを生成してください。

入力された言葉: 「${word}」

以下のJSON形式のみで返してください。説明文やコードブロック記号は含めないでください：
{
  "colors": ["rgb(r,g,b)", "rgb(r,g,b)", "rgb(r,g,b)"],
  "shape": "circle" or "ring" or "star" or "star6" or "crystal" or "spark" or "burst" or "drop" or "lightning" or "ribbon" or "spiral" or "triangle" or "rune" or "square" or "cross",
  "speed": 1.0 to 5.0,
  "spread": 0.5 to 6.28,
  "directionAngle": -3.14 to 3.14,
  "lifetime": 60 to 200,
  "size": 3 to 15,
  "gravity": -0.1 to 0.1,
  "wobble": true or false,
  "rotationSpeed": 0.0 to 0.3,
  "trail": true or false,
  "count": 80 to 200,
  "stagger": 0 to 20,
  "maxCount": 150 to 300,
  "spawnRate": 0.3 to 0.9,
  "wordColor": "#rrggbb",
  "description": "この言葉のエフェクトの説明（日本語40文字以内）"
}

言葉が無意味・造語・擬音でも必ず語感から何かを感じ取り、個性的なエフェクトを作ってください。`;

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      messages: [{ role: 'user', content: prompt }]
    })
  });

  if (!response.ok) throw new Error('API error');
  const data = await response.json();
  const text = data.content.map(i => i.text || '').join('');
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

// ===== UI Logic =====
const wordInput = document.getElementById('word-input');
const castBtn = document.getElementById('cast-btn');
const kotodamaWord = document.getElementById('kotodama-word');
const effectDesc = document.getElementById('effect-desc');
const loadingIndicator = document.getElementById('loading-indicator');
const placeholder = document.getElementById('placeholder');
const errorMsg = document.getElementById('error-msg');
const historyEl = document.getElementById('history');

let history = [];

function showLoading() {
  placeholder.style.display = 'none';
  kotodamaWord.style.display = 'none';
  effectDesc.style.display = 'none';
  loadingIndicator.style.display = 'flex';
  errorMsg.style.display = 'none';
}

function showEffect(word, effect) {
  loadingIndicator.style.display = 'none';
  kotodamaWord.style.display = 'block';
  effectDesc.style.display = 'flex';

  kotodamaWord.textContent = word;
  kotodamaWord.style.color = effect.wordColor || '#e8e4f0';
  kotodamaWord.style.textShadow = `0 0 30px ${effect.wordColor || '#c8b8ff'}88`;
  effectDesc.textContent = effect.description || '';

  // Word entrance animation
  kotodamaWord.style.transform = 'scale(0.5)';
  kotodamaWord.style.opacity = '0';
  requestAnimationFrame(() => {
    kotodamaWord.style.transition = 'all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
    kotodamaWord.style.transform = 'scale(1)';
    kotodamaWord.style.opacity = '1';
  });
}

function showError(msg) {
  loadingIndicator.style.display = 'none';
  placeholder.style.display = 'block';
  errorMsg.style.display = 'block';
  errorMsg.textContent = msg;
}

function addHistory(word, effect) {
  history.unshift({ word, effect });
  if (history.length > 8) history.pop();
  renderHistory();
}

function renderHistory() {
  historyEl.innerHTML = '';
  history.forEach(({ word, effect }) => {
    const tag = document.createElement('div');
    tag.className = 'history-tag';
    tag.textContent = word;
    tag.style.borderColor = (effect.wordColor || '#c8b8ff') + '44';
    tag.addEventListener('click', () => {
      castWord(word, effect);
    });
    historyEl.appendChild(tag);
  });
}

async function castWord(word, cachedEffect = null) {
  if (!word.trim()) return;

  castBtn.disabled = true;
  showLoading();
  particles = [];

  try {
    const effect = cachedEffect || await fetchEffectFromAI(word);
    showEffect(word, effect);
    spawnBurst(effect);
    if (!cachedEffect) addHistory(word, effect);
  } catch (e) {
    showError('言霊の解読に失敗しました。もう一度お試しください。');
    console.error(e);
  } finally {
    castBtn.disabled = false;
  }
}

castBtn.addEventListener('click', () => {
  const word = wordInput.value.trim();
  if (word) castWord(word);
});

wordInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const word = wordInput.value.trim();
    if (word) castWord(word);
  }
});
</script>
